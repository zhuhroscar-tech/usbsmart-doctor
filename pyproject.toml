[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usbsmart-doctor"
version = "0.2.11"
description = "Finds the smartctl device type your USB drive's bridge chip needs and prints a clean SMART health report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhuhroscar-tech" }]
requires-python = ">=3.9"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/usbsmart-doctor"
Changelog = "https://github.com/zhuhroscar-tech/usbsmart-doctor/blob/main/CHANGELOG.md"

[project.scripts]
usbsmart-doctor = "usbsmart_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
